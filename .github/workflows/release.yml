name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Verify tag and application version
        shell: pwsh
        run: |
          npm run versions:check
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          $appVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $appVersion) { throw "El tag v$tagVersion no coincide con la versión $appVersion." }
      - name: Download verified sidecars
        run: npm run sidecars:download
      - name: Verify sidecars
        run: npm run sidecars:verify
      - name: Build NSIS installer
        run: npm run tauri build
      - name: Build portable ZIP
        run: npm run package:portable
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            artifacts/YT-Playlist-Downloader-portable.zip
