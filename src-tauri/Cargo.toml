[package]
name = "yt-playlist-downloader"
version = "0.1.0"
description = "Local YouTube playlist downloader"
authors = ["YT Playlist Downloader contributors"]
edition = "2021"

[lib]
name = "yt_playlist_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
id3 = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
